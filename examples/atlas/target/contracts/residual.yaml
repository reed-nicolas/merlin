# Authored intent for the shared fact-backed capability deriver. A fresh selected
# facts.json must supply the geometry, capacities and instruction codes.
facts_source: rtl
name: atlas
version: '0.1'
status: prototype
requires_human_review: true
family: tensor_resident
features: [self_hosted_isa, systolic_array, fp8_mxu, bf16_accumulate]
capabilities:
  ops: [matmul]
compute_units:
  - name: mxu
    kind: systolic
    dtypes: [fp8_e4m3]
    ops: [matmul]
    accumulate:
      - {in: fp8_e4m3, weight: fp8_e4m3, acc: bf16}
    semantic_capabilities:
      - {family: contraction, dtypes: [fp8_e4m3], ranks: [2, 3]}
memory_model:
  resident: true
  accumulators: true
compiler_obligations: [must_tile_to_mesh_shape]
hardware_promises: []
runtime_promises: []
legality: []
runtime:
  backends: [simulator]
  default_backend: simulator
runner:
  dtype: fp8_e4m3
  fourth_output_name: kernel.S
  model_ext: npu_model
provenance: >-
  Candidate compute format and MXU intent from the curated Atlas MxuParams.scala,
  PE.scala and software-spec.yaml; geometry, storage and decoder facts require
  one explicitly selected FIRRTL/CIRCT source bundle. This reference is not an
  executable backend or a numerical/transfer qualification.
notes: >-
  Model-operand scale encoding and block size remain unknown. The E8M0-named
  command byte is observed on result-pack paths and does not establish an
  operand block scale or an executable requantization route. Operation and
  transfer admission remain unreviewed in software-spec.yaml.
